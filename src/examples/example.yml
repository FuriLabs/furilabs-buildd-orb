description: >
  Build and deploy a flatpak from a manifest.
usage:
  version: 2.1
  orbs:
    buildd: furilabs-buildd/furilabs-buildd-orb@volatile

  workflows:
    build-and-deploy:
      jobs:
        - buildd/flatpak-build:
            manifest: io.github.shinyvision.Circadia.yml
            arch: amd64
            name: flatpak-build-amd64

        - buildd/flatpak-build:
            manifest: io.github.shinyvision.Circadia.yml
            arch: arm64
            name: flatpak-build-arm64

        - buildd/flatpak-deploy:
            app_id: io.github.shinyvision.Circadia
            arch: amd64
            context: furilabs-buildd
            requires: [flatpak-build-amd64]

        - buildd/flatpak-deploy:
            app_id: io.github.shinyvision.Circadia
            arch: arm64
            context: furilabs-buildd
            requires: [flatpak-build-arm64]
